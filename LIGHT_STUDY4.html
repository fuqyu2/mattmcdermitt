function grid(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  S=W>=H?Math.max(W/13.5,H/8.44):W/8.2;cols=2*Math.ceil(W/S/2+1);rows=2*Math.ceil(H/S/2+1);
  xs=[];ys=[];cs=[];rs=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const x=c+.5-cols/2,y=r+.5-rows/2;if(Math.abs(x)<1&&Math.abs(y)<1)continue;xs.push(x);ys.push(y);cs.push(c);rs.push(r);}
  N=xs.length;R=xs.map((x,i)=>Math.max(0,Math.hypot(x,ys[i])-1.55));Z=new Float32Array(N);PIC=new Int32Array(N);HOST.z=Z;HOST.pic=PIC;HOST.hw=W/S/2;HOST.hh=H/S/2;
  L.setGrid(N,xs,ys,null,cs,rs);slot=-9;}
// three layouts in turn, as on the wall: wide strips, tall split screens, staggered banks; one large screen on alternate sides
function layout(j){const k=((j%3)+3)%3,work=j<0||j%7===6?-1:j%7;SCR=[];const idx=new Map();scrOf=new Int32Array(N);
  const hero=j>=0?{c0:(j&1)?cols/2+1:cols/2-1-Math.round(cols*.24),r0:rows/2-Math.round(rows*.22),w:Math.round(cols*.24),h:Math.round(rows*.44)}:null;
  for(let i=0;i<N;i++){const c=cs[i],r=rs[i];let key,box;
    if(hero&&c>=hero.c0&&c<hero.c0+hero.w&&r>=hero.r0&&r<hero.r0+hero.h){key='H';box=hero;}
    else if(k===0){const b=Math.floor(r/3),o=(b%2)*3,q=Math.floor((c+o)/7);key='a'+b+'|'+q;box={c0:q*7-o,r0:b*3,w:7,h:3};}
    else if(k===1){const q=Math.floor(c/4),o=(q%2)*2,b=Math.floor((r+o)/6);key='b'+q+'|'+b;box={c0:q*4,r0:b*6-o,w:4,h:6};}
    else{const b=Math.floor(r/4),o=(b%2)*3,q=Math.floor((c+o)/6);key='c'+b+'|'+q;box={c0:q*6-o,r0:b*4,w:6,h:4};}
    if(!idx.has(key)){const n=SCR.length,u=hash(n*7+j*13,3),v=hash(n*11+j*5,9),zoom=key==='H'?1:[1,1.5,2.1,2.8][Math.floor(hash(n+j*31,5)*4)];
      idx.set(key,n);SCR.push({box,im:work<0?Math.floor(hash(n*3+j,1)*6):work,zoom,u,v});}
    scrOf[i]=PIC[i]=idx.get(key);}
  HOST.nPic=SCR.length;}
// the water ring: a crest, a shallower trough, a second ring a third the size 0.47 s later; 9 cubes a second
const wf=q=>q<=0||q>=1?0:Math.sin(6.2831853*q)*Math.pow(1-q,1.35)*T5(q/.12)*(1-T5((q-.8)/.2))/.62;
function water(){const Rm=Math.max(4,Math.hypot(HOST.hw,HOST.hh)-1.55),kf=Math.log(.25)/Rm,j=t>=TW?Math.floor((t-TW)/P+1e-9):-1,hs=[[TLAND,1.6]];if(j>=0)hs.push([TW+j*P,1]);if(j>=1)hs.push([TW+(j-1)*P,1]);
  for(let i=0;i<N;i++){let z=0;for(const h of hs){const s=t-h[0]-R[i]/9;if(s>0)z+=h[1]*Math.exp(kf*R[i])*(wf(s/.55)+.3333*wf((s-.47)/.55));}Z[i]=z;}}
const NAME=['MATT','MCDERMITT','DIRECTOR'];
function titleLines(j){if(j<0||j%7===6)return NAME;const w=WORKS[j%7];return [String(w.artist||'').toUpperCase(),String(w.title||'').toUpperCase()].filter(Boolean);}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const ox=W/2,oy=H/2,g=Math.max(1.5,S*.022),m=L.m,e=L.e,de=L.de,pan=.03*Math.sin(t*.21);
  for(let i=0;i<N;i++){const sz=S*(1+.06*Z[i])-g,px=ox+xs[i]*S-sz/2,py=oy-ys[i]*S-sz/2;if(px>W||py>H||px+sz<0||py+sz<0)continue;
    const b=m[i];
    if(white){const v=Math.round(255*Math.pow(Math.min(b/1.7,1),.9));ctx.globalAlpha=1;ctx.fillStyle='rgb('+v+','+v+','+v+')';ctx.fillRect(px,py,sz,sz);}
    else{const sc=SCR[scrOf[i]],im=IM[sc.im],bx=sc.box,iw=im.naturalWidth||640,ih=im.naturalHeight||320;
      // the screen's own crop of the picture (cover fit, then its zoom), and this cube's part of it
      const asp=bx.w/bx.h,ia=iw/ih;let cw=ia>asp?ih*asp:iw,ch=ia>asp?ih:iw/asp;cw/=sc.zoom;ch/=sc.zoom;const cx=(iw-cw)*Math.min(1,Math.max(0,sc.u+pan)),cy=(ih-ch)*sc.v;
      const fx=(cs[i]-bx.c0)/bx.w,fy=(bx.r0+bx.h-1-rs[i])/bx.h;
      if(im.complete&&im.naturalWidth){ctx.globalCompositeOperation='source-over';ctx.globalAlpha=Math.min(b,1);ctx.drawImage(im,cx+fx*cw,cy+fy*ch,cw/bx.w,ch/bx.h,px,py,sz,sz);
        if(b>1){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.min(.9,(b-1)*.95);ctx.drawImage(im,cx+fx*cw,cy+fy*ch,cw/bx.w,ch/bx.h,px,py,sz,sz);}}}
    // the glass's cut edges: a beat ahead of the picture, the edge facing the title first
    const ev=e[i];if(ev>.01||Math.abs(de[i])>.5){ctx.globalCompositeOperation='lighter';const hy=Math.hypot(xs[i],ys[i])||1,ux=xs[i]/hy,uy=ys[i]/hy,w2=Math.max(1.5,S*.035),k=.04*de[i];
      const ed=(f,x,y,w,h)=>{const a=.30*(ev+k*f);if(a>.01){ctx.globalAlpha=Math.min(.95,a);ctx.fillRect(x,y,w,h);}};ctx.fillStyle='#cfe4ff';
      ed(ux,px,py,w2,sz);ed(-ux,px+sz-w2,py,w2,sz);ed(-uy,px,py,sz,w2);ed(uy,px,py+sz-w2,sz,w2);}}
  // the title block
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;const bs=2*S-g,bx0=ox-bs/2,by0=oy-bs/2;ctx.fillStyle='#04060a';ctx.fillRect(bx0,by0,bs,bs);ctx.strokeStyle='rgba(190,215,255,.35)';ctx.lineWidth=1;ctx.strokeRect(bx0+.5,by0+.5,bs-1,bs-1);
  const lines=titleLines(slot),pad=bs*.11,tw=bs-2*pad;ctx.fillStyle='#e9f1ff';ctx.textBaseline='alphabetic';ctx.textAlign='left';
  const F="px Impact,Haettenschweiler,'Arial Narrow Bold','Helvetica Neue Condensed',sans-serif";let hs=[],tot=0;for(const s of lines){ctx.font='100'+F;const w=ctx.measureText(s).width||1,fs=Math.min(100*tw/w,bs*.42);hs.push(fs);tot+=fs*.86;}
  const kk=Math.min(1,(bs-2*pad)/tot);let yy=oy-tot*kk/2;ctx.globalAlpha=Math.min(1,.78*L.o[0]);
  for(let q=0;q<lines.length;q++){const fs=hs[q]*kk;ctx.font=fs+F;const w=ctx.measureText(lines[q]).width;yy+=fs*.86;ctx.save();ctx.translate(bx0+pad,yy-fs*.06);ctx.scale(tw/w,1);ctx.fillText(lines[q],0,0);ctx.restore();}
  if(HOST.ply&&HOST.ply.on){const u=t-HOST.ply.t0;ctx.globalAlpha=.8*T5((u-.3)/.4);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.globalAlpha=T5((u-.5)/.3);ctx.fillStyle='#9aa7b5';ctx.font='14px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('the player opens here · click to close',ox,oy+bs*.9);}
  ctx.globalAlpha=1;}
function step(dt){t+=dt;const j=t>=TW?Math.floor((t-TW)/P+1e-9):-1;if(j!==slot){slot=j;layout(j);HOST.charPrev=HOST.charNow;HOST.charNow=j<0||j%7===6?0:(j%7)+1;}
  water();const p=HOST.ptr;p.speed*=Math.exp(-dt/.12);L.step(t,dt,HOST);clk.textContent=t.toFixed(1)+' s';}
function frame(now){if(testClock===null){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;step(dt);draw();}requestAnimationFrame(frame);}
function restart(){t=T0;slot=-9;HOST.charNow=HOST.charPrev=0;HOST.ply=null;L.reset();}
// the pointer: where it is in cubes from the title, and how fast it is moving (cubes a second)
let pl=null;function ptr(ev){const x=(ev.clientX-W/2)/S,y=-(ev.clientY-H/2)/S,now=performance.now(),p=HOST.ptr;if(pl){const d=Math.max(1,now-pl.t)/1000,v=Math.hypot(x-pl.x,y-pl.y)/d;p.speed=Math.max(p.speed,Math.min(v,60));}pl={x,y,t:now};p.x=x;p.y=y;p.on=1;}
addEventListener('pointermove',ptr);addEventListener('pointerleave',()=>{HOST.ptr.on=0;pl=null;});
cv.addEventListener('pointerdown',ev=>{const x=(ev.clientX-W/2)/S,y=-(ev.clientY-H/2)/S;if(HOST.ply&&HOST.ply.on)HOST.ply={on:false,t1:t,x:HOST.ply.x,y:HOST.ply.y};else if(Math.abs(x)>1||Math.abs(y)>1)HOST.ply={on:true,x,y,t0:t};});
addEventListener('keydown',ev=>{const k=ev.key.toLowerCase();if(k==='r')restart();else if(k==='l')L.cfg.on=L.cfg.on?0:1;else if(k==='g')white=!white;else if(k>='1'&&k<='6'){L.cfg.open=+k;restart();}});
// the four controls; the address carries their numbers
const UI=document.getElementById('ui'),KEYS=[['presence','Presence','p'],['pace','Pace','a'],['intricacy','Intricacy','i'],['calm','Calm','c']];
const hv={};for(const kv of location.hash.slice(1).split(/[&,]/)){const m=kv.split('=');if(m.length===2)hv[m[0]]=+m[1];}
if(hv.open>=1&&hv.open<=6)L.cfg.open=hv.open|0;
function writeHash(){const s=KEYS.map(k=>k[2]+'='+L.cfg[k[0]].toFixed(2)).join('&')+'&open='+L.cfg.open;try{history.replaceState(null,'','#'+s);}catch(e){}}
for(const k of KEYS){if(isFinite(hv[k[2]]))L.cfg[k[0]]=Math.min(2,Math.max(0,hv[k[2]]));const lab=document.createElement('label'),sp=document.createElement('span'),inp=document.createElement('input'),b=document.createElement('b');
  sp.textContent=k[1];inp.type='range';inp.min=0;inp.max=2;inp.step=.05;inp.value=L.cfg[k[0]];b.textContent=(+inp.value).toFixed(2);
  inp.addEventListener('input',()=>{L.cfg[k[0]]=+inp.value;b.textContent=(+inp.value).toFixed(2);writeHash();});lab.append(sp,inp,b);UI.append(lab);}
addEventListener('resize',()=>{grid();});grid();
// (for the checks) step the clock by hand: __study.hand(), then __study.tick(1/60)
window.__study={L,HOST,hand(){testClock=1;restart();},tick(dt){step(dt);draw();return t;},get t(){return t;},set white(v){white=!!v;},restart};
requestAnimationFrame(now=>{last=now;requestAnimationFrame(frame);});
})();
</script></body></html>
